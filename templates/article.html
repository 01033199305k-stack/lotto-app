<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ article.title }} | 로또 번호 추첨기</title>
<meta name="description" content="{{ article.description }}">
<meta name="theme-color" content="#4f46e5">
<link rel="canonical" href="https://lotto-app-m0fe.onrender.com/guide/{{ article.slug }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ article.title }}">
<meta property="og:description" content="{{ article.description }}">
<meta property="og:url" content="https://lotto-app-m0fe.onrender.com/guide/{{ article.slug }}">
<meta property="og:image" content="https://lotto-app-m0fe.onrender.com/static/icons/icon-512.png">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="로또 번호 추첨기">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ article.title }}">
<meta name="twitter:description" content="{{ article.description }}">
<meta name="twitter:image" content="https://lotto-app-m0fe.onrender.com/static/icons/icon-512.png">
<link rel="stylesheet" href="{{ asset('style.css') }}">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9852386681125742" crossorigin="anonymous"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8XNLS8PVQQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8XNLS8PVQQ');
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ article.title | tojson }},
  "description": {{ article.description | tojson }},
  "inLanguage": "ko",
  "mainEntityOfPage": "https://lotto-app-m0fe.onrender.com/guide/{{ article.slug }}",
  "publisher": {
    "@type": "Organization",
    "name": "로또 번호 추첨기"
  }
}
</script>
</head>
<body>
  <main class="card article" style="max-width:680px;">
    <nav class="breadcrumb">
      <a href="{{ url_for('index') }}">번호 추첨기</a>
      <span aria-hidden="true"> › </span>
      <a href="{{ url_for('guide') }}">상식 가이드</a>
    </nav>

    <h1>{{ article.title }}</h1>
    <p class="article-lead">{{ article.summary }}</p>

    {{ article.body | safe }}

    <div class="ad-slot">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-9852386681125742"
           data-ad-slot="5525665125"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <section class="related">
      <h2>다른 글도 읽어보세요</h2>
      <ul class="article-list">
        {% for other in others %}
        <li>
          <a href="{{ url_for('guide_article', slug=other.slug) }}">{{ other.title }}</a>
          <span>{{ other.summary }}</span>
        </li>
        {% endfor %}
      </ul>
    </section>

    <p style="margin-top:26px; text-align:center;">
      <a href="{{ url_for('index') }}">← 번호 뽑으러 가기</a>
    </p>
  </main>
  <script src="{{ asset('ads.js') }}"></script>
</body>
</html>
