name: Update draw data

on:
  schedule:
    # 로또는 토요일 20:45, 연금복권은 목요일 19:05 추첨(KST).
    # 결과 반영 여유를 두고 KST 일요일·금요일 새벽에 돈다. (cron은 UTC)
    - cron: "0 16 * * 6"  # 토 16:00 UTC = 일 01:00 KST
    - cron: "0 16 * * 4"  # 목 16:00 UTC = 금 01:00 KST
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "새 회차가 없어도 Render 배포를 트리거한다 (배포 훅 점검용)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new rounds
        run: python update_data.py

      - name: Commit if data changed
        id: commit
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No new rounds; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update draw data (automated)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Render clones this repo as a public URL rather than through the GitHub
      # app, so it never receives a push webhook and its "auto-deploy on commit"
      # setting never fires. The deploy hook is what actually ships the change.
      - name: Trigger Render deploy
        if: steps.commit.outputs.changed == 'true' || inputs.force_deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [[ -z "$HOOK" ]]; then
            echo "RENDER_DEPLOY_HOOK secret is not set; skipping deploy trigger."
            echo "Data is committed, but the live site will not pick it up until a deploy runs."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$HOOK")
          echo "deploy hook -> $code"
          # 훅 URL이 틀리면 조용히 넘어가지 않고 여기서 실패해야 알아챈다.
          [[ "$code" == "200" || "$code" == "201" ]]
